<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nyxiebones' Portal</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="shortcut icon" href="/assets/icons/favicon.png" type="image/x-icon">
    <script src="/js/index.js" defer></script>
</head>

<body class="light-theme">
    <header id="header" class="wrapper-column-between">
        <section id="header-top" class="wrapper-row-center-between">
            <h1 class="text-stroke-2">NYXIEBONES</h1>
            <button id="toggle-theme" type="button"><i class="fa fa-sun"></i></button>
        </section>

        <!--header items-->

    </header>
    <main id="page" class="wrapper-row">
        <aside id="sidebar" class="wrapper-column-center-evenly">
            <!--sidebar items-->
            <h4 class="text-stroke-1">PORTAL</h4>
            <img src="/assets/img/sidebar.jpg" alt="Shizuku hxh">
            <div class="buttons wrapper-row-between">
                <button><i class="fa fa-user"></i></button>
                <button><i class="fa fa-globe"></i></button>
                <button><i class="fa fa-handshake"></i></button>
                <button><i class="fa fa-dollar"></i></button>
            </div>

        </aside>

        <section id="documents" class="wrapper-column">
            <!--popup-->
            <nav class="popup-menu" aria-label="master navigation">

            </nav>


            <!--posts and main page content-->
            <section id="top-nav" class="wrapper-row-center-between">
            <button class="nav-button wrapper-row-center-between">
                <h6>creative</h6>
                <i class="fa fa-palette"></i>
            </button>
            <button class="nav-button wrapper-row-center-between">
                <h6>docs</h6>
                <i class="fa fa-folder-open"></i>
            </button>
            <button class="nav-button wrapper-row-center-between">
                <h6>schedule</h6>
                <i class="fa fa-calendar"></i>
            </button>
            <button class="nav-button wrapper-row-center-between">
                <h6>resources</h6>
                <i class="fa fa-bookmark"></i>
            </button>
            <button class="nav-button wrapper-row-center-between">
                <h6>journal</h6>
                <i class="fa fa-book-open"></i>
            </button>
            <button id="toggle-popup" class="nav-button popup-button wrapper-row-center-between" type="button">
                <h6>more</h6>
                <i class="fa fa-plus"></i>
            </button>
        </section>


            <!-- placeholder-->
            

            <!--placeholder-->
        </section>

    </main>

    <footer id="foot" class="wrapper-row-center-around">
        <!--footer items-->
        <a class="link" href="/">contact</a>
    </footer>

</body>

</html>
